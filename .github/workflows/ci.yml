name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Compile
        run: make compile

      - name: Unit tests
        run: make test-unit

      - name: Script contracts
        run: make test-scripts

      - name: Knip
        run: make knip

  headless-e2e:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Resolve Chrome binary
        run: |
          CHROME_BIN="${{ steps.setup-chrome.outputs.chrome-path }}"
          if [ -z "$CHROME_BIN" ]; then
            CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          fi
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=${CHROME_BIN}" >> "$GITHUB_ENV"

      - name: Headless E2E
        run: make test-e2e-headless

  artifact:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build distribution artifact
        run: make zip

      - name: Verify ZIP artifact
        run: make zip-artifact-contract

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-package
          path: .output/*.zip
          retention-days: 7
